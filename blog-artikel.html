<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog – Hybridlogs</title>
    <meta name="description" content="Hybridlogs Blog – Lernstrategien, Studientipps und Methoden für mehr Produktivität.">
    <meta name="robots" content="index, follow">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Hybridlogs">
    <meta property="og:locale" content="de_DE">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap">
    <link rel="preload" href="css/styles.css" as="style">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="header-slot"></div>

<!-- ===== Breadcrumb ===== -->
<nav class="breadcrumb" aria-label="Breadcrumb">
    <div class="container">
        <a href="index.html">Home</a>
        <span class="breadcrumb-sep" aria-hidden="true">›</span>
        <a href="blog.html">Blog</a>
        <span class="breadcrumb-sep" aria-hidden="true">›</span>
        <span id="blogBreadcrumbTitle" aria-current="page">Artikel</span>
    </div>
</nav>

<!-- ===== Artikel ===== -->
<main class="section section-article">
    <div class="container container-narrow">

        <!-- Artikel gefunden -->
        <article id="blogPost" hidden>
            <header class="article-header" data-animate>
                <span id="blogPostCategory" class="section-label"></span>
                <h1 id="blogPostTitle"></h1>
                <p id="blogPostExcerpt" class="article-excerpt"></p>
                <div id="blogPostMeta" class="article-meta"></div>
            </header>

            <div id="blogPostImageWrap" class="article-cover" hidden>
                <img id="blogPostImage" src="" alt="" loading="eager" decoding="async">
            </div>

            <div id="blogPostContent" class="article-content prose"></div>

            <footer class="article-footer">
                <a href="blog.html" class="btn btn-outline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Zurück zum Blog
                </a>
            </footer>
        </article>

        <!-- Artikel nicht gefunden -->
        <div id="blogPostNotFound" class="blog-empty" hidden>
            <p>Dieser Artikel wurde nicht gefunden.</p>
            <a href="blog.html" class="btn btn-primary" style="margin-top: 1.5rem;">Zum Blog</a>
        </div>

    </div>
</main>

<!-- ===== CTA ===== -->
<section class="section section-elevated">
    <div class="container container-narrow text-center" data-animate>
        <span class="section-label">Passend zum Artikel</span>
        <h2 class="section-title">Methoden in die Praxis bringen.</h2>
        <p class="section-subtitle">Unsere Journals sind gemacht für genau das, was du hier gerade gelesen hast.</p>
        <a href="index.html#produkte" class="btn btn-primary btn-lg">Produkte ansehen</a>
    </div>
</section>

<div id="footer-slot"></div>

<script src="js/components.js"></script>
<script src="js/blog-data.js"></script>
<script src="js/blog.js"></script>
<script src="js/main.js"></script>
</body>
</html>
