<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="robots" content="noindex">
    <link rel="icon" href="../../images/Logo/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/assessment.css">

<body class="hm-assessment">

    <!-- Header -->
    <header class="hm-header">
        <a href="index.html" class="hm-header__logo">
            hybrid<span>logs</span><span class="hm-header__product">Human Map</span>
        </a>
        <nav class="hm-header__nav">
            <a href="index.html" class="hm-header__back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>

    <div class="hm-interstitial" id="hm-interstitial" aria-hidden="true">

    <footer class="hm-footer">
