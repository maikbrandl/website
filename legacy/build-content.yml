name: Build content cache + sitemap

on:
  push:
    branches: [master]
    paths:
      - 'content/**'
      - 'scripts/build-content.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-content
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run content build
        run: node scripts/build-content.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No content changes, nothing to commit."
          else
            git commit -m "chore: rebuild content cache + sitemap [skip ci]"
            git push
          fi
