<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suche · Hybridlog Wissensraum</title>
    <meta name="description" content="Durchsuche Themen, Tools und Beiträge der Hybridlog Wissensplattform.">
    <meta name="robots" content="noindex">
    <script>(function () { try { var t = localStorage.getItem('hl-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { } })();</script>
    <script>window.PLATFORM_BASE = './';</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">
    <link rel="stylesheet" href="css/hybridlog-design-system.css?v=20260913">
</head>

<body data-title="Suche">
    <a class="skip-link" href="#main">Zum Inhalt springen</a>
    <nav data-hl-crumbs></nav>

    <main id="main">
        <div class="wrap">
            <section class="block tight" aria-labelledby="suche-title">
                <p class="eyebrow">Wissensraum</p>
                <h1 id="suche-title" style="font-size:var(--fs-h2);margin-top:6px">Suche</h1>

                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="search" data-search-input placeholder="Themen, Tools oder Beiträge suchen …" autocomplete="off">
                </div>

                <div class="search-filters" data-search-filters>
                    <button type="button" class="search-filter active" data-filter="alle">Alle</button>
                    <button type="button" class="search-filter" data-filter="thema">Themen</button>
                    <button type="button" class="search-filter" data-filter="tool">Tools</button>
                    <button type="button" class="search-filter" data-filter="artikel">Beiträge</button>
                </div>

                <p class="disc" data-search-empty style="margin-top:20px">Gib einen Suchbegriff ein oder wähle einen Filter, um Themen, Tools und Beiträge zu durchsuchen.</p>
                <div data-search-results></div>
            </section>
        </div>

        <footer>
            <div class="wrap">Hybridlog · Wissensplattform über den Menschen</div>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="js/data.js?v=20260901"></script>
    <script src="js/cms-fetch.js?v=20260901"></script>
    <script src="js/render.js?v=20260902"></script>
    <script src="js/suche.js?v=20260913"></script>
    <script src="js/theme.js?v=20260901"></script>
    <script src="js/shell.js?v=20260904"></script>
</body>

</html>
